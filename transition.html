<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>transition site</title>
<style>
    body {background-image:linear-gradient(135deg,rgb(255, 202, 230),rgb(139, 72, 187)); background-size:cover; background-attachment: fixed; color:rgb(76, 1, 130); p{color:rgb(180, 36, 82)};
     .this {color:black}; #that{color:aliceblue}; #thing{color:blueviolet} 
      #one{ width: 100px; height: 100px;margin-bottom: 0.5em;
        margin-top: 0.5em; background-color: rgb(252, 105, 176); border: 5px solid aquamarine; transition:2s;} #one:hover{transform:rotate(1800deg);scale:2; translate: 75px}
      #two{ width: 100px; height: 100px;margin-bottom: 0.5em;
        margin-top: 0.5em; background-color: rgb(252, 105, 176); border: 5px solid aquamarine; transition:2s;} #two:hover{transform: skewX(135deg);}
      #three{ width: 100px; height: 100px;margin-bottom: 0.5em;
        margin-top: 0.5em; background-color: rgb(252, 105, 176); border: 5px solid aquamarine; transition:2s;} #three:hover{transform: rotateY(180deg);}
      #four{ width: 100px; height: 100px;margin-bottom: 0.5em;
    margin-top: 0.5em; background-color: rgb(252, 105, 176); border: 5px solid aquamarine; transition:2s;} #four:hover{transform: translate(350px, 500px); ;} 
    #five{ width: 100px; height: 100px;margin-bottom: 0.5em;
      margin-top: 0.5em; background-color: rgb(252, 105, 176); border: 5px solid aquamarine;} 
    </style>
 
    
</head>
            
<body>
    <div id="one"> spin! </div>
    <div id="two"> skew</div>
    <div id="three"> flip</div>
    <div id="four"> this one is shy (it might run away)</div>
    <div id="five" <P><a href="index.html">home</a></P> </div>

</body>

</html>
