<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>links</title>
<style>
body{background-image:linear-gradient(135deg,rgb(105, 242, 228),rgb(30, 49, 160)); background-size:cover; background-attachment: fixed;

a{color:rgb(255, 107, 223);font-weight: 999;font-size: 50px; text-decoration: none;display:block;} 

.bees{color:rgb(255, 149, 20);font-weight: 999; text-decoration: none; display:block} 

.cool{color:rgb(243, 255, 74);font-weight: 999; text-decoration: none;display:block; margin-left: auto; margin-right: auto;} 

    a:hover{color:springgreen;text-decoration:underline wavy;}
    a{background: rgb(152, 117, 255); padding: 10px; border:10px solid purple; border-radius: 10px;box-shadow: 10px 10px ;}
    
   .bees:hover{color:rgb(144, 0, 255);text-decoration:underline dotted;}
    .bees{background: rgb(255, 239, 17); padding: 10px; border:10px solid rgb(189, 0, 57);border-radius: 10px; box-shadow: 10px 10px;}

    .cool:hover{color:rgb(255, 0, 0);text-decoration:line-through double;}
    .cool{background: rgb(145, 178, 255); padding: 10px; border:10px solid rgb(85, 0, 255);border-radius: 10px; box-shadow: 10px 10px;}
</style>
</head>
            
<body>
<p><a href="https://noclip.website/">this is a link!</a></p>
<p><a class="bees" href="https://noclip.website/">this is the same link!</a></p>
<p><a class="cool"href="https://noclip.website/">this is also that link!</a></p>
</body>

</html>
